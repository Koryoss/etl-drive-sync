name: etl-drive-sync

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 07:00 KST (UTC 22:00). 하루 1회면 충분합니다.
  workflow_dispatch: {}      # 수동 실행

concurrency:
  group: etl-drive-sync
  cancel-in-progress: false

permissions:
  contents: write            # state/synced.json 커밋용

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run sync
        env:
          CANVAS_BASE_URL: ${{ secrets.CANVAS_BASE_URL }}
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_ROOT_FOLDER_ID: ${{ secrets.DRIVE_ROOT_FOLDER_ID }}
        run: python sync.py
      - name: Save sync state
        run: |
          git config user.name "etl-drive-sync[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add state/synced.json || true
          git diff --cached --quiet || (git commit -m "chore: update sync state" && git push)
